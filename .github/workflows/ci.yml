name: Cross-OS Java CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Tests and Check Coverage
        # Dùng verify thay vì test để JaCoCo chạy mục tiêu 'check'
        run: mvn -B verify

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        # if: always() đảm bảo báo cáo luôn được upload lên kể cả khi pipeline bị ĐỎ do thiếu % coverage
        if: always()
        with:
          # Đặt tên artifact kèm theo tên OS để không bị ghi đè lên nhau trong matrix
          name: jacoco-report-${{ matrix.os }}
          path: target/site/jacoco/